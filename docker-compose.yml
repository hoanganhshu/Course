version: '3.8'

services:
  # 1. PostgreSQL 16 - Database quan hệ ACID, hỗ trợ JSONB + GIN Index
  postgres:
    image: postgres:16-alpine
    container_name: khgh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: khoahocgiahoi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecretPassword123!
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 - In-memory Cache, Token Blacklist & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: khgh-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "RedisPassword123!", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "RedisPassword123!", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. RabbitMQ 3.13 - Message Broker AMQP cho xử lý bất đồng bộ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: khgh-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: khgh_rabbit
      RABBITMQ_DEFAULT_PASS: RabbitPassword123!
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Meilisearch v1.8 - Công cụ tìm kiếm siêu tốc, tự sửa lỗi chính tả
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: khgh-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "MeiliMasterKey12345678901234567890!"
      MEILI_ENV: "production"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Backend - Spring Boot 3.3.0 & Java 17/21
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khgh-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/khoahocgiahoi
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: SecretPassword123!
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: RedisPassword123!
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: khgh_rabbit
      SPRING_RABBITMQ_PASSWORD: RabbitPassword123!
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: MeiliMasterKey12345678901234567890!
      AES_SECRET_KEY: 4d696c697461727947726164654b657932353642697473536563726574313233 # 32 bytes hex
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  meilisearch_data:
