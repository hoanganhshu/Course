# ===================================================
# KHÓA HỌC GIÁ HỜI - BACKEND CONFIGURATION
# ===================================================

# Server
server.port=8080
server.servlet.context-path=/api/v1

# ===================================================
# DATABASE - PostgreSQL 16 (ACID & JSONB + GIN Index)
# ===================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/khoahocgiahoi
spring.datasource.username=postgres
spring.datasource.password=SecretPassword123!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===================================================
# CACHE & IN-MEMORY - Redis 7
# ===================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=RedisPassword123!
spring.data.redis.timeout=6000ms

# ===================================================
# MESSAGE BROKER - RabbitMQ 3.13
# ===================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=khgh_rabbit
spring.rabbitmq.password=RabbitPassword123!
rabbitmq.exchange.order=khgh.order.exchange
rabbitmq.queue.activation=khgh.order.activation.queue
rabbitmq.queue.email=khgh.order.email.queue
rabbitmq.routingkey.activation=khgh.order.activation
rabbitmq.routingkey.email=khgh.order.email

# ===================================================
# MILITARY-GRADE ENCRYPTION (AES-256-GCM)
# ===================================================
# 32 bytes HEX key (256 bits)
security.aes.secret-key=4d696c697461727947726164654b657932353642697473536563726574313233

# ===================================================
# SEARCH ENGINE - Meilisearch v1.8
# ===================================================
meilisearch.host=http://localhost:7700
meilisearch.api-key=MeiliMasterKey12345678901234567890!

# ===================================================
# JWT CONFIGURATION
# ===================================================
# Secret phải dài ít nhất 256 bits (32 ký tự) cho HS256
jwt.secret=khoahocgiahoi-super-secret-key-2024-please-change-in-production-env
jwt.access-token-expiration=86400000
# 24 giờ (ms)
jwt.refresh-token-expiration=604800000
# 7 ngày (ms)

# ===================================================
# EMAIL (GMAIL SMTP)
# ===================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===================================================
# CLOUDINARY (IMAGE UPLOAD)
# ===================================================
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

# ===================================================
# PAYMENT WEBHOOK
# ===================================================
# SePay Webhook Secret (dùng để xác thực checksum)
payment.sepay.webhook-secret=your_sepay_webhook_secret
# PayOS API Keys
payment.payos.client-id=your_payos_client_id
payment.payos.api-key=your_payos_api_key
payment.payos.checksum-key=your_payos_checksum_key

# Tên ngân hàng & số tài khoản nhận tiền
payment.bank.name=MB Bank
payment.bank.account-number=0123456789
payment.bank.account-name=CONG TY TNHH KHOA HOC GIA HOI
payment.order-code-prefix=KHGH

# ===================================================
# CORS
# ===================================================
app.cors.allowed-origins=http://localhost:3000,https://khoahocgiahoi.com

# ===================================================
# ASYNC / THREAD POOL
# ===================================================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# ===================================================
# LOGGING
# ===================================================
logging.level.com.khoahocgiahoi=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
