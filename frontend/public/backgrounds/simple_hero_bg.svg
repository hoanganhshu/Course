<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- 1. Màu nền gradient chuyển sắc sâu thẳm tối giản -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="45%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 2. Ánh sáng tỏa tròn trung tâm (Radial Ambient Glow) dịu mát -->
    <radialGradient id="centerGlow" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.10" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="accentGlow" cx="80%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- 3. Lưới điểm số học tối giản (Dot Grid) -->
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" fill-opacity="0.15" />
    </pattern>

    <!-- 4. Mặt nạ làm mờ dần lưới điểm về các góc (Vignette Mask) -->
    <radialGradient id="gridMaskGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="gridMask">
      <rect width="1920" height="1080" fill="url(#gridMaskGrad)" />
    </mask>
  </defs>

  <!-- Lớp nền chính (Không có bất kỳ đường nét stroke nào) -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Lưới điểm số hóa công nghệ mờ dần -->
  <rect width="1920" height="1080" fill="url(#dotGrid)" mask="url(#gridMask)" />

  <!-- Ánh sáng tỏa tròn trung tâm tôn chữ tiêu đề -->
  <rect width="1920" height="1080" fill="url(#centerGlow)" />
  <rect width="1920" height="1080" fill="url(#accentGlow)" />
</svg>
